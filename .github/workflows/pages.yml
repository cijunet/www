name: Deploy 词句 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# 构建在本地完成（xlsx 源表仅留本地，不进公开仓库）；CI 仅把已构建好的 WWW/ 部署到 Pages。
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: WWW

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
